<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomeço — Uma Luz de Esperança</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--BARRA DE ACESSIBILIDADE-->
    <div class="barra-top">
        <div class="container barra-top__conteudo">
            <button class="botao botao--perigo botao--pequeno" data-abrir="modal-emergencia" ajuda urgente 24h></button>
            <div class="barra-top__ferramentas">
                <button class="botao-barra" id="fonte-menor" aria-label="Diminuir fonte">A</button>
                <button class="botao-barra" id="fonte-normal" aria-label="Tamanho normal da fonte">A</button>
                <button class="botao-barra" id="fonte-maior" aria-label="Aumentar fonte">A+</button>
                <button class="botao-barra" id="alto-contraste" aria-pressed="false">Alto contraste</button>
            </div>
        </div>
    </div>

    <!--CABEÇALHO-->
    <header class="cabecalho">
        <div class="container cabecalho__conteudo">
            <a href="#inicio" class="logo">
                <span class="logo">Recomeço</span>
                <span class="logo__legenda">Apoio e Recuperação</span>
            </a>
            <button class="menu-botao" id="menu-botao" aria-expanded="false" aria-controls="menu">Menu</button>
            <nav class="menu" id="menu" aria-label="Navegação Principal">
                <a href="#inicio">Inicio</a>
                <a href="#locais">Locais</a>
                <a href="#autoavaliacao">Autoavaliação</a>
                <a href="#familias">Para familias</a>
                <a href="#grupos">Grupos</a>
                <a href="#historias">Historias</a>
                <a href="#faq">Duvidas</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="inicio" class="hero">
            
        </section>
    </main>
</body>
</html>
